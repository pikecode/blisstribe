server {
    server_name admin.ytxybl.com;

    root /opt/blisstribe/current/apps/admin/dist;
    index index.html;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.ytxybl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ytxybl.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.ytxybl.com;
    return 301 https://$host$request_uri;
}
